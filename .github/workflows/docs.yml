name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs to determine version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1

      - name: Install the project
        # Full project install (not --only-group) so autodoc can import ezmsg.qt and its deps
        run: uv sync --group docs

      - name: Build documentation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd docs
          uv run make html

      - name: Add .nojekyll file
        run: touch docs/build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build/html'

  deploy:
    # Deploy on pushes to main and when a release is published (not on PRs)
    if: github.event_name == 'push' || github.event_name == 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
